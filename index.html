<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#101012">
  <title>YT Music — слушать здесь</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#101012;color:#f3f3f5}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh}main{width:min(880px,100%);margin:auto;padding:52px 24px 36px}
    header{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:650;letter-spacing:-.5px}.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#ff4358;color:#fff;font-size:14px}
    .intro{margin:64px 0 28px}h1{font-size:clamp(32px,6vw,48px);font-weight:600;letter-spacing:-1.8px;margin:0 0 12px;line-height:1.15}p{font-size:16px;color:#a5a5af;line-height:1.6;margin:0}
    label{display:block;font-size:14px;color:#b5b5bf;margin-bottom:10px}.input-row{display:flex;gap:10px}input{flex:1;min-width:0;background:#1b1b20;border:1px solid #37373f;border-radius:12px;padding:16px;color:#fff;font:inherit;font-size:16px}input::placeholder{color:#777782}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #ff6678;outline-offset:3px}
    button{border:0;border-radius:12px;background:#f3f3f5;color:#161619;font:inherit;font-weight:600;font-size:16px;padding:15px 25px;cursor:pointer}button:hover{background:#dedee4}button:active{transform:translateY(1px)}
    #message{font-size:14px;min-height:24px;margin-top:10px}#message.error{color:#ff929e}.stage{margin-top:22px;border:1px solid #2b2b32;border-radius:18px;overflow:hidden;background:#17171b;aspect-ratio:16/9;min-height:220px;display:grid;place-items:center}.empty{text-align:center;padding:28px}.empty-icon{color:#5f5f6d;font-size:40px;margin-bottom:15px}.empty p{font-size:15px}.empty strong{display:block;font-size:18px;font-weight:500;color:#dbdbe3;margin-bottom:6px}iframe{width:100%;height:100%;min-height:220px;border:0;display:block}.below{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px}.below p,.below a{font-size:14px}.below a{color:#d2d2dc;text-underline-offset:4px;white-space:nowrap}footer{border-top:1px solid #26262d;margin-top:48px;padding-top:20px;font-size:14px;color:#787884}a[hidden]{display:none}
    @media(max-width:520px){main{padding:28px 18px}.intro{margin-top:48px}.input-row{flex-direction:column}button{width:100%}.below{align-items:flex-start;flex-direction:column}.stage{margin-top:14px}footer{margin-top:32px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
<main>
  <header><span class="mark" aria-hidden="true">▶</span>YT Music</header>
  <section class="intro"><h1>Музыка. Просто здесь.</h1><p>Вставь ссылку из YouTube Music и слушай на этой странице.</p></section>
  <form id="form" novalidate>
    <label for="url">Ссылка на трек или плейлист</label>
    <div class="input-row"><input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://music.youtube.com/watch?v=…" aria-describedby="message" required><button type="submit">Открыть</button></div>
    <p id="message" role="status" aria-live="polite"></p>
  </form>
  <section class="stage" id="stage" aria-label="Музыкальный плеер"><div class="empty"><div class="empty-icon" aria-hidden="true">♫</div><strong>Твоя музыка будет здесь</strong><p>Добавь ссылку, чтобы открыть плеер</p></div></section>
  <div class="below"><p>Если трек недоступен, открой его на YouTube.</p><a id="source" href="https://music.youtube.com/" target="_blank" rel="noopener noreferrer" hidden>Открыть на YouTube</a></div>
  <footer>Ссылки YouTube Music и YouTube · Без регистрации в приложении</footer>
</main>
<script>
  const form=document.getElementById('form');
  const field=document.getElementById('url');
  const message=document.getElementById('message');
  const stage=document.getElementById('stage');
  const source=document.getElementById('source');
  function parseLink(value){
    const text=value.trim();
    if(!text)throw new Error('Вставь ссылку на трек или плейлист.');
    let url;
    try{url=new URL(/^https?:\/\//i.test(text)?text:'https://'+text)}catch{throw new Error('Не получилось прочитать ссылку. Скопируй её целиком.');}
    const host=url.hostname.toLowerCase();
    if(!['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtu.be','www.youtu.be'].includes(host)||!['https:','http:'].includes(url.protocol)||url.username||url.password||url.port)throw new Error('Нужна ссылка с YouTube Music или YouTube.');
    const parts=url.pathname.split('/').filter(Boolean);
    let video=null;
    if(host==='youtu.be'||host==='www.youtu.be')video=parts[0];
    else if(url.pathname==='/watch')video=url.searchParams.get('v');
    else if(['embed','shorts','live'].includes(parts[0]))video=parts[1];
    const list=url.searchParams.get('list');
    if(video&&!/^[\w-]{11}$/.test(video))throw new Error('В ссылке некорректный код видео. Скопируй ссылку через «Поделиться».');
    const validList=list&&/^[\w-]{10,150}$/.test(list);
    if(!video&&!(url.pathname==='/playlist'&&validList))throw new Error('Открой трек или плейлист и скопируй его ссылку через «Поделиться».');
    const embed=new URL(video?'https://www.youtube.com/embed/'+video:'https://www.youtube.com/embed/videoseries');
    embed.searchParams.set('playsinline','1');
    embed.searchParams.set('autoplay','1');
    embed.searchParams.set('rel','0');
    if(validList){embed.searchParams.set('list',list);embed.searchParams.set('listType','playlist');}
    const time=url.searchParams.get('t')||url.searchParams.get('start');
    if(time){const m=time.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/);if(m){const seconds=Number(m[1]||0)*3600+Number(m[2]||0)*60+Number(m[3]||0);if(seconds>0&&Number.isSafeInteger(seconds))embed.searchParams.set('start',String(seconds));}}
    const original=new URL(video?'https://music.youtube.com/watch':'https://music.youtube.com/playlist');
    if(video)original.searchParams.set('v',video);
    if(validList)original.searchParams.set('list',list);
    return {embed:embed.href,original:original.href};
  }
  form.addEventListener('submit',event=>{
    event.preventDefault();
    try{
      const link=parseLink(field.value);
      const player=document.createElement('iframe');
      player.title='Плеер YouTube';player.src=link.embed;
      player.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      player.allowFullscreen=true;player.referrerPolicy='strict-origin-when-cross-origin';
      stage.replaceChildren(player);
      source.href=link.original;source.hidden=false;
      field.removeAttribute('aria-invalid');message.className='';
      message.textContent='Плеер открыт. Если музыка не началась, нажми ▶ в плеере.';
    }catch(error){message.textContent=error.message;message.className='error';field.setAttribute('aria-invalid','true');field.focus();}
  });
</script>
</body>
</html>
